services:
  indexer:
    build:
      context: .
      dockerfile: Dockerfile
    restart: on-failure
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/postgres?options=--search_path%3Dsui_indexer
      - RUST_LOG=info
      - LOCAL_MODE=true
      - CHECKPOINT_DIR=/data/checkpoints
    volumes:
      # Mount the shared volume for read-only access
      - sui_checkpoints:/data/checkpoints:ro
